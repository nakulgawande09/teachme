<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>अक्षर खेळ · Akshar Khel</title>
<meta name="description" content="A quiet alphabet toy — English, मराठी and संस्कृत letters to hear and trace.">
<meta name="theme-color" content="#F3EADC">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="अक्षर खेळ">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-180.png">
<link rel="icon" href="/icons/192.png" sizes="192x192">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Tiro+Devanagari+Marathi&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/screens.css">
<link rel="stylesheet" href="/css/parent.css">

<link rel="modulepreload" href="/js/main.js">
<link rel="modulepreload" href="/js/core/store.js">
<link rel="modulepreload" href="/js/render/index.js">
<link rel="modulepreload" href="/js/data/tracks.js">
</head>
<body>

<div id="app" data-screen="home" data-track="en" data-stage="demo" data-alive="0"
     data-engine="mask" data-audio="idle" data-first-run="1" data-storage="ok">
<div class="measure">

  <!-- ── 01 track picker ────────────────────────────────────────────── -->
  <section data-motion class="screen screen--home" data-screen-label="01 track picker">
    <header class="bar">
      <div class="brand">
        <span class="brand__dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="brand__name">अक्षर खेळ</span>
      </div>
      <button class="hold-door" id="holdDoor" type="button"
              aria-label="For grown-ups — press and hold">
        <span class="hold-door__dots" aria-hidden="true"><i></i><i></i><i></i></span>
        <span class="hold-door__label">hold</span>
        <span class="hold-door__track"><i class="hold-door__fill"></i></span>
      </button>
    </header>

    <div class="spacer"></div>
    <div class="tracks" id="trackList"></div>
    <div class="spacer"></div>
  </section>

  <!-- ── 02 letter grid ─────────────────────────────────────────────── -->
  <section data-motion class="screen screen--grid" data-screen-label="02 letter grid">
    <header class="bar">
      <button class="btn-round" type="button" data-action="go-home" aria-label="Home">
        <span data-icon="home"></span>
      </button>
      <span class="chip chip--track" id="gridChip"></span>
      <button class="btn-round btn-round--haldi" type="button" data-action="say-track"
              aria-label="Hear this track">
        <span class="audio-ring" aria-hidden="true"></span>
        <span data-icon="speaker"></span>
      </button>
    </header>

    <div class="scroll" id="gridScroll"></div>

    <p class="legend">
      <span class="legend__dot" aria-hidden="true"></span>
      letters already brought to life — no count, no score
    </p>
  </section>

  <!-- ── 03 listen card ─────────────────────────────────────────────── -->
  <section data-motion class="screen screen--listen" data-screen-label="03 listen card">
    <header class="bar">
      <button class="btn-round" type="button" data-action="go-grid" aria-label="Back">
        <span data-icon="back"></span>
      </button>
      <span class="dots" id="listenDots" aria-hidden="true"></span>
      <button class="btn-round" type="button" data-action="go-home" aria-label="Home">
        <span data-icon="home"></span>
      </button>
    </header>

    <div class="spacer"></div>
    <div class="listen">
      <div class="listen__glyph" id="listenGlyph" data-motion></div>
      <div class="listen__sound" id="listenSound"></div>
      <div class="listen__art" id="listenArt" aria-hidden="true"></div>
      <div class="listen__keyword" id="listenKeyword"></div>
      <p class="listen__note" id="listenNote"></p>
    </div>
    <div class="spacer"></div>

    <div class="cta-row">
      <button class="btn-big btn-big--haldi" type="button" data-action="say-letter"
              aria-label="Hear this letter">
        <span class="audio-ring" aria-hidden="true"></span>
        <span data-icon="speaker" data-icon-size="42"></span>
        <span class="finger" data-motion aria-hidden="true"></span>
      </button>
      <button class="btn-big btn-big--peacock" type="button" data-action="go-trace"
              id="btnTrace" aria-label="Trace this letter">
        <span data-icon="trace" data-icon-size="42"></span>
        <span class="finger" data-motion aria-hidden="true"></span>
      </button>
    </div>
  </section>

  <!-- ── 04 trace ───────────────────────────────────────────────────── -->
  <section data-motion class="screen screen--trace" data-screen-label="04 trace">
    <header class="bar">
      <button class="btn-round" type="button" data-action="go-listen" aria-label="Back">
        <span data-icon="back"></span>
      </button>
      <div class="beads" id="beads" role="progressbar" aria-label="Strokes"></div>
      <button class="btn-round" type="button" data-action="replay-demo"
              aria-label="Show me again">
        <span data-icon="replay"></span>
      </button>
      <button class="btn-round" type="button" data-action="go-home" aria-label="Home">
        <span data-icon="home"></span>
      </button>
    </header>

    <div class="spacer"></div>

    <div class="slate" id="slate">
      <svg class="slate__svg" id="slateSvg" viewBox="0 0 100 100" aria-hidden="true"
           preserveAspectRatio="xMidYMid meet">
        <g class="slate__ghosts" id="slateGhosts"></g>
        <g class="slate__guides" id="slateGuides"></g>
        <g class="slate__demo" id="slateDemo"></g>
      </svg>
      <canvas class="slate__mask" id="slateMask" data-motion aria-hidden="true"></canvas>
      <canvas class="slate__canvas" id="slateCanvas"></canvas>
      <div class="slate__alive" id="slateAlive" aria-hidden="true"></div>
      <span class="slate__ring" aria-hidden="true"></span>
      <div class="slate__seeds" id="slateSeeds" aria-hidden="true"></div>
      <span class="slate__dot" id="slateDot" aria-hidden="true"></span>
      <span class="slate__arrow" id="slateArrow" aria-hidden="true"><span data-icon="arrowTip" data-icon-size="26"></span></span>
      <span class="finger" id="traceFinger" data-motion aria-hidden="true"></span>
    </div>

    <div class="spacer"></div>

    <div class="trace-foot">
      <p class="hint" id="traceHint"></p>
      <div class="chip-retry" data-motion id="retryChip">
        <span class="chip-retry__dot" aria-hidden="true"></span>
        <span>let's try that one again</span>
      </div>
      <button class="btn-round btn-round--haldi" type="button" data-action="say-letter"
              aria-label="Hear this letter">
        <span class="audio-ring" aria-hidden="true"></span>
        <span data-icon="speaker"></span>
      </button>
    </div>
  </section>

  <!-- ── 04b recall ─────────────────────────────────────────────────── -->
  <!-- Error-free by construction: a wrong tap replays the sound and the card
       settles back. No score, no buzzer, nothing blocked. -->
  <section data-motion class="screen screen--quiz" data-screen-label="04b recall">
    <header class="bar">
      <button class="btn-round" type="button" data-action="go-home" aria-label="Home">
        <span data-icon="home"></span>
      </button>
      <span class="dots" id="quizDots" aria-hidden="true"></span>
      <span class="bar__spacer"></span>
    </header>

    <div class="spacer"></div>
    <div class="quiz">
      <div class="quiz__prompt" id="quizPrompt"></div>
      <div class="quiz__cards" id="quizCards"></div>
    </div>
    <div class="spacer"></div>
  </section>

  <!-- ── 09 today is done ───────────────────────────────────────────── -->
  <section data-motion class="screen screen--done" data-screen-label="09 today is done">
    <div class="spacer"></div>
    <div class="done" data-motion>
      <div class="done__glyphs" id="doneGlyphs"></div>
      <div class="ribbon" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
      <h2 class="done__title" id="doneTitle">आजचं काम झालं!</h2>
      <p class="done__body" id="doneBody"></p>
    </div>
    <div class="spacer"></div>
    <div class="done__actions">
      <button class="btn-big btn-big--leaf btn-big--xl" type="button"
              data-action="finish-day" aria-label="Finished">
        <span data-icon="check" data-icon-size="52"></span>
      </button>
      <button class="link-grown" type="button" data-action="go-explore">
        Grown-up: keep exploring the letters
      </button>
    </div>
  </section>

  <!-- ── 05 shloka ──────────────────────────────────────────────────── -->
  <section data-motion class="screen screen--shloka" data-screen-label="05 shloka">
    <header class="bar">
      <button class="btn-round" type="button" data-action="go-home" aria-label="Home">
        <span data-icon="home"></span>
      </button>
      <span class="chip chip--track chip--om">ॐ</span>
      <span class="bar__spacer"></span>
    </header>

    <div class="scroll">
      <div class="shlokas" id="shlokaList"></div>
      <h2 class="section-label">जादूचे शब्द</h2>
      <div class="grid" id="wordGrid"></div>
    </div>

    <div class="trace-foot">
      <button class="btn-big btn-big--indigo" type="button" data-action="play-all"
              aria-label="Play all lines">
        <span data-icon="play" data-icon-size="38"></span>
      </button>
    </div>
  </section>

</div><!-- /.measure -->

<!-- ── 06 celebration ───────────────────────────────────────────────── -->
<div class="overlay overlay--celebrate" id="ovCelebrate">
  <div class="celebrate" data-motion>
    <div class="celebrate__glyph" id="celebrateGlyph"></div>
    <div class="ribbon" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <div class="celebrate__keyword" id="celebrateKeyword"></div>
    <span class="dots dots--lg" id="celebrateDots" aria-hidden="true"></span>
  </div>
  <div class="celebrate__actions">
    <button class="btn-big btn-big--sm" type="button" data-action="trace-again"
            aria-label="Again">
      <span data-icon="replay" data-icon-size="34"></span>
    </button>
    <button class="btn-big btn-big--leaf btn-big--lg" type="button" data-action="next-letter"
            aria-label="Next">
      <span id="celebrateNextIcon" data-icon="next" data-icon-size="42"></span>
    </button>
    <button class="btn-big btn-big--sm" type="button" data-action="go-home"
            aria-label="Home">
      <span data-icon="home" data-icon-size="34"></span>
    </button>
  </div>
</div>

<!-- ── 07 break prompt ──────────────────────────────────────────────── -->
<div class="overlay overlay--break" id="ovBreak">
  <div class="sheet" data-motion>
    <div class="breathe" data-motion aria-hidden="true"><i></i></div>
    <h2 class="sheet__title">थोडी विश्रांती</h2>
    <p class="sheet__body" id="breakBody"></p>
    <button class="btn-big btn-big--leaf btn-big--xl" type="button" data-action="end-session"
            aria-label="Finish for now">
      <span data-icon="check" data-icon-size="52"></span>
    </button>
    <button class="link-grown" type="button" data-action="five-more" id="fiveMore">
      Grown-up: five more minutes
    </button>
  </div>
</div>

<!-- ── 08a parent gate ──────────────────────────────────────────────── -->
<div class="overlay overlay--gate" id="ovGate">
  <div class="gate" data-motion id="gateCard">
    <p class="eyebrow">FOR GROWN-UPS</p>
    <p class="gate__q">Tap the answer to continue: <strong id="gateQuestion"></strong></p>
    <div class="gate__choices" id="gateChoices"></div>
    <button class="gate__back" type="button" data-action="close-gate">Back to play</button>
  </div>
</div>

<!-- ── 08b parent area ──────────────────────────────────────────────── -->
<div class="overlay overlay--parent" id="ovParent">
  <div class="parent">
    <header class="parent__bar">
      <p class="eyebrow">FOR GROWN-UPS</p>
      <button class="btn-round" type="button" data-action="close-parent" aria-label="Close">
        <span data-icon="close"></span>
      </button>
    </header>
    <div class="parent__cards" id="parentCards"></div>
  </div>
</div>

</div><!-- /#app -->

<script type="module" src="/js/main.js"></script>
<noscript>
  <p style="padding:24px;font:400 17px/1.5 system-ui,sans-serif;color:#241E18">
    अक्षर खेळ needs JavaScript to speak and to draw.
  </p>
</noscript>
</body>
</html>
